# Thin release caller (Tier 4, extend). Logic lives in the reusable workflow hosted in
# template-base; this file just references it. Pinned to @v1 — never @main.
# Requires the repo to define a `release` script (and an NPM_TOKEN secret if it publishes).
name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    uses: Knowledgemonger-LLC/template-base/.github/workflows/reusable-release.yml@v1
    with:
      package-manager: pnpm
    secrets: inherit
