# Copier configuration for repo-baseline.
#
# `copier copy gh:Knowledgemonger-LLC/repo-baseline <dest>`  -> scaffold a NEW repo.
# `copier update`                                            -> re-apply this template to an
#   EXISTING repo (3-way merge via .copier-answers.yml). This is the propagation/merge lane
#   that kills drift. check_drift.py is a SEPARATE reporting/CI gate — it never merges.
#
# Only the `template/` subdirectory is rendered into target repos. This repo's own meta-files
# (baseline.yaml, scripts/, .github/, AGENTS.md, ...) are never copied out.

_subdirectory: template
_answers_file: .copier-answers.yml

_envops:
  keep_trailing_newline: true

# ---- Identity ----
# A single `org` drives every GitHub slot (uses:, renovate github> preset, org/.github,
# repo URLs, CODEOWNERS team refs) AND all human-facing text (titles, display names).
org:
  type: str
  help: "GitHub organization (login + display). Used for every github slot and human-facing text."
  default: "Knowledgemonger-LLC"

# Legal entity for LICENSE — deliberately NOT the github login (plural, with a space).
license_holder:
  type: str
  help: "Legal copyright holder for LICENSE (e.g. \"Knowledgemongers LLC\")."
  default: "Knowledgemongers LLC"

license_year:
  type: str
  help: "Copyright year for LICENSE."
  default: "2026"

# Default code owner — a TEAM, not a personal handle. Used in agent boundaries / CODEOWNERS refs.
default_owner:
  type: str
  help: "Default owning team (org/team form)."
  default: "@Knowledgemonger-LLC/maintainers"

# ---- Project ----
project_name:
  type: str
  help: "Human-readable project name."

# ---- Archetype blanks (filled per stack; seed the Tier 3 files) ----
stack:
  type: str
  help: "One-line description of the stack (language, framework, runtime)."
  default: "TODO: describe the stack (language, framework, runtime)."

pkg_manager:
  type: str
  help: "Primary package manager (drives the safe-command allowlist in .claude/settings.json)."
  default: "npm"

build_command:
  type: str
  help: "Shell command to build (leave the TODO if not applicable)."
  default: "# TODO: set build command"

test_command:
  type: str
  help: "Shell command to run tests."
  default: "# TODO: set test command"

run_command:
  type: str
  help: "Shell command to run the app locally."
  default: "# TODO: set run command"

lint_command:
  type: str
  help: "Shell command to lint."
  default: "# TODO: set lint command"
