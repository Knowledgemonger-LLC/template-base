# EXAMPLE — a target repo's .pre-commit-config.yaml after scaffolding + local edits.
# This is NOT a caller: the file is scaffolded in by Copier and edited IN PLACE. It doubles
# as the human-readable spec for what the marker-block drift rule permits.
#
#   ┌─ MANAGED (synced) ─ everything between baseline:start / baseline:end. check_drift
#   │  compares this region verbatim, INCLUDING the `rev:` pins. A silent rev downgrade of
#   │  detect-secrets (v1.5.0 -> older) or any id change here is flagged as drift.
#   └─ EDITABLE ───────── anything OUTSIDE the region is repo-owned and never flagged.
repos:
  # baseline:start
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
  # baseline:end

  # ── EDITABLE: stack-specific hooks (this repo is Python; freely added/removed) ──
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
