# EXAMPLE caller — copy into a target repo as .github/workflows/release.yml.
# Pin to @v1 (or a commit SHA) — never @main. `secrets: inherit` passes NPM_TOKEN through
# (the repo must define an NPM_TOKEN secret if its `release` script publishes to npm).
name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    uses: Knowledgemonger-LLC/repo-baseline/.github/workflows/reusable-release.yml@v1
    with:
      package-manager: pnpm
    secrets: inherit
