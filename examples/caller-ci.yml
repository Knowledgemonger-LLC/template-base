# EXAMPLE caller (NODE repos only) — copy into a Node target repo as .github/workflows/ci.yml.
# This is the "extend, don't copy" pattern: a few lines that reference the reusable Node CI
# workflow hosted in template-base. Pin to @v1 (or a commit SHA) — never @main.
#
# NOTE: template-base itself ships NO language CI. This caller is a NODE-family element — it
# belongs to a Node archetype (template-node / template-next-sanity). reusable-node-ci.yml is
# hosted here INTERIM and will relocate to that archetype later. Non-Node repos do not use this.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: Knowledgemonger-LLC/template-base/.github/workflows/reusable-node-ci.yml@v1
    with:
      node-version: "20"
      package-manager: pnpm
      # working-directory: "."
      # run-build: true
