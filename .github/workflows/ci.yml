# CI for template-base itself (NOT a reusable workflow).
# Gates the two source-of-truth invariants:
#   1. BASELINE.md is regenerated from baseline.yaml (and baseline.yaml is schema-valid).
#   2. template/ renders to a baseline-conformant repo (drift checker self-test).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  baseline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install pyyaml jsonschema jinja2

      - name: Manifest valid + BASELINE.md current
        run: python scripts/gen_baseline_md.py --check

      - name: Drift checker self-test (template renders clean)
        run: python scripts/check_drift.py --selftest
