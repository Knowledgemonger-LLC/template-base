# Copier configuration for template-base.
#
# `copier copy gh:Knowledgemonger-LLC/template-base <dest>`  -> scaffold a NEW repo.
# `copier update`                                            -> re-apply this template to an
#   EXISTING repo (3-way merge via .copier-answers.yml). This is the propagation/merge lane
#   that kills drift. check_drift.py is a SEPARATE reporting/CI gate — it never merges.
#
# Only the `template/` subdirectory is rendered into target repos. This repo's own meta-files
# (baseline.yaml, scripts/, .github/, AGENTS.md, ...) are never copied out.

_subdirectory: template
_answers_file: .copier-answers.yml

_envops:
  keep_trailing_newline: true

# ---- Identity ----
# A single `org` drives every GitHub slot (uses:, renovate github> preset, org/.github,
# repo URLs, CODEOWNERS team refs) AND all human-facing text (titles, display names).
org:
  type: str
  help: "GitHub organization (login + display). Used for every github slot and human-facing text."
  default: "Knowledgemonger-LLC"

# Legal entity for LICENSE — deliberately NOT the github login (plural, with a space).
license_holder:
  type: str
  help: "Legal copyright holder for LICENSE (e.g. \"Knowledgemongers LLC\")."
  default: "Knowledgemongers LLC"

license_year:
  type: str
  help: "Copyright year for LICENSE."
  default: "2026"

# Per-repo choice — NOT a synced universal. Default proprietary so open-sourcing is always
# an explicit opt-in. LICENSE.jinja renders the body matching this choice.
license:
  type: str
  help: "License for this repo."
  default: proprietary
  choices:
    - proprietary
    - MIT
    - Apache-2.0

# Default code owner — a TEAM, not a personal handle. Used in agent boundaries / CODEOWNERS refs.
default_owner:
  type: str
  help: "Default owning team (org/team form)."
  default: "@Knowledgemonger-LLC/maintainers"

# ---- Project ----
project_name:
  type: str
  help: "Human-readable project name."

# Interim single-template archetype selector. Recorded in .copier-answers.yml to capture intent;
# template-base has NO archetype-specific files yet. When an archetype accumulates enough unique
# files, it graduates to its own template-<name> repo that COMPOSES template-base (see README).
archetype:
  type: str
  help: "Repo archetype (interim; graduates to a template-<archetype> repo later)."
  default: base
  choices:
    - base
    - api
    - web
    - sagemaker

# Ecosystem / language identity — ORTHOGONAL to `archetype`. `archetype` is the repo SHAPE
# (api / web / ml service); `language` is the runtime ECOSYSTEM. A Next.js site and a Node
# service share language=node but differ in archetype. Downstream archetype templates and CI
# selection key off `language`; template-base itself ships NO language-specific CI (see the
# reusable-node-ci.yml note in baseline.yaml). Default `none` keeps the base language-agnostic.
# NOTE: the archetype choices above still carry some ecosystem flavor (web/api≈node,
# sagemaker≈python); realigning them to be purely shape-based is a later follow-up, out of
# scope for this de-leak.
language:
  type: str
  help: "Runtime ecosystem for this repo. CI/archetype selection keys off this. 'none' = language-agnostic base."
  default: none
  choices:
    - none
    - node
    - python
    - terraform

# ---- Features (opt-in workflow toggles) ----
# The release caller (.github/workflows/release.yml) is NOT universal: it triggers on `v*`
# tags and would fail / mis-publish in repos that don't publish. Default FALSE — enable only
# for publishing repos (libraries/packages that define a `release` script). When false, Copier
# skips the file entirely via the conditional filename on the release template.
include_release_workflow:
  type: bool
  help: "Ship the release workflow (.github/workflows/release.yml)? Only for publishing repos."
  default: false

# ---- Archetype blanks (filled per stack; seed the Tier 3 files) ----
stack:
  type: str
  help: "One-line description of the stack (language, framework, runtime)."
  default: "TODO: describe the stack (language, framework, runtime)."

pkg_manager:
  type: str
  help: >-
    Primary package/dependency manager for this repo's language (e.g. npm/pnpm for Node,
    pip/uv/poetry for Python). Drives the safe-command allowlist in .claude/settings.json.
    No default — it is language-specific and must be answered.

# Universal SLOT (Tier 4: universal in kind, specific in form): every repo pins the version of
# its runtime — Node 24.16.0, Python 3.12, a Terraform version, etc. No default (no Node value
# imposed); the answer is required and recorded for downstream archetype CI to consume.
runtime_version:
  type: str
  help: "Version of the language runtime to pin (e.g. \"24.16.0\" for Node, \"3.12\" for Python)."

build_command:
  type: str
  help: "Shell command to build (leave the TODO if not applicable)."
  default: "# TODO: set build command"

test_command:
  type: str
  help: "Shell command to run tests."
  default: "# TODO: set test command"

run_command:
  type: str
  help: "Shell command to run the app locally."
  default: "# TODO: set run command"

lint_command:
  type: str
  help: "Shell command to lint."
  default: "# TODO: set lint command"
