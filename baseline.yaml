# baseline.yaml — SOURCE OF TRUTH for repo-baseline.
#
# Lists every element that should exist in EVERY repo at the org by default, what tier it
# belongs to, and the mechanism by which it gets there. BASELINE.md (the human index) is
# GENERATED from this file by scripts/gen_baseline_md.py — never hand-edit the index.
# Validate this file against scripts/baseline.schema.json.
#
# Field reference (per element):
#   path            Location of the file IN A TARGET REPO. null when there is no local file
#                   (Tier 2 inherited elements).
#   tier            1-4. See the tier model in README.md / AGENTS.md.
#   mechanism       copy    -> content canonical here, copied & sync-enforced into the repo
#                   extend  -> repo references an external canonical (package / preset /
#                              reusable workflow); the local file is a thin pointer
#                   inherit -> no local file; provided automatically by org/.github
#                   generate-> produced by a generator in this repo (reserved; not yet used
#                              by any target-repo element)
#   source_of_truth Where the canonical version lives (template path, pkg: spec, github>
#                   preset, org/.github:FILE, or a pinned reusable-workflow ref).
#   applies_to      "all", or a list of stack archetypes (e.g. [typescript]).
#   required        Whether every applicable repo MUST have this element.
#   notes           Drift rule / caveats / cross-references.

version: 1

# org is FINAL: Knowledgemonger-LLC — the literal GitHub login. The session email domain is
# NOT authoritative for the org; this is settled, do not re-raise.
org: Knowledgemonger-LLC

# NOTE: template/.copier-answers.yml.jinja ships in every repo (Copier writes .copier-answers.yml
# and 3-way-merges from it on `copier update`). It is propagation BOOKKEEPING, not a tiered
# baseline element, so it is intentionally absent from `elements` and excluded from drift.
elements:
  # ───────────────────────── Tier 1 — Truly universal files (copy) ─────────────────────────
  - path: .editorconfig
    tier: 1
    mechanism: copy
    source_of_truth: template/.editorconfig
    applies_to: all
    required: true
    notes: >-
      Universal editor settings. Full-file drift enforcement: target copy must match the
      rendered template exactly.

  - path: .gitattributes
    tier: 1
    mechanism: copy
    source_of_truth: template/.gitattributes
    applies_to: all
    required: true
    notes: >-
      Line-ending and diff/merge attributes. Full-file drift enforcement.

  - path: .gitignore
    tier: 1
    mechanism: copy
    source_of_truth: template/.gitignore.jinja
    applies_to: all
    required: true
    notes: >-
      Canonical base ignores. Full-file enforcement on the base content. Stack-specific
      ignores should be minimal and are expected to live in tool configs or below the base
      (see open question on gitignore appends).

  - path: LICENSE
    tier: 1
    mechanism: copy
    drift: generate-once
    source_of_truth: template/LICENSE.jinja
    applies_to: all
    required: true
    notes: >-
      Per-repo CHOICE, not a synced universal — the body is selected at creation
      (proprietary [default] | MIT | Apache-2.0) with {{ license_holder }} / {{ license_year }}
      templated. drift=generate-once: scaffolded once, NOT full-file enforced — a different
      license is a legitimate choice (proprietary product vs. deliberately open-sourced), not
      drift. check_drift only verifies presence and that holder/year are stamped. Default
      proprietary so open-sourcing is an explicit opt-in.

  # ─────────────────── Tier 2 — Governance / community-health (inherit) ────────────────────
  # No local files. Provided automatically by the org .github repo. Rendered in BASELINE.md
  # with path: null and a "No action in target repo" note.
  #
  # DECISION (final): Knowledgemonger-LLC/.github is PUBLIC, and all five file types inherit
  # from it. None of these files are sensitive (SECURITY/CONTRIBUTING/CODE_OF_CONDUCT are meant
  # for outsiders; issue/PR templates are boilerplate); public is REQUIRED for issue/PR-template
  # inheritance and free for the rest, so the "keep governance internal" branch is dropped.
  # ESCAPE HATCH (not built): if a specific governance file must ever be non-public, move THAT
  # one file from Tier-2 inherit to a Tier-1/3 COPY element and keep only the templates in the
  # public .github.
  - path: null
    tier: 2
    mechanism: inherit
    source_of_truth: Knowledgemonger-LLC/.github:CONTRIBUTING.md
    applies_to: all
    required: true
    notes: >-
      No action in target repo — inherited from Knowledgemonger-LLC/.github. DECISION (final):
      that repo is PUBLIC. Inheritance keys on ACCOUNT OWNERSHIP, not consumer visibility, so
      PRIVATE product repos DO inherit; only the source .github visibility matters. (This
      file-type could also inherit from an INTERNAL .github, but PUBLIC is chosen — see the
      Tier-2 escape-hatch note.) Docs-verified.

  - path: null
    tier: 2
    mechanism: inherit
    source_of_truth: Knowledgemonger-LLC/.github:SECURITY.md
    applies_to: all
    required: true
    notes: >-
      No action in target repo — inherited from Knowledgemonger-LLC/.github. DECISION (final):
      that repo is PUBLIC. Inheritance keys on ACCOUNT OWNERSHIP, not consumer visibility, so
      PRIVATE product repos DO inherit; only the source .github visibility matters. (This
      file-type could also inherit from an INTERNAL .github, but PUBLIC is chosen — see the
      Tier-2 escape-hatch note.) Docs-verified.

  - path: null
    tier: 2
    mechanism: inherit
    source_of_truth: Knowledgemonger-LLC/.github:CODE_OF_CONDUCT.md
    applies_to: all
    required: true
    notes: >-
      No action in target repo — inherited from Knowledgemonger-LLC/.github. DECISION (final):
      that repo is PUBLIC. Inheritance keys on ACCOUNT OWNERSHIP, not consumer visibility, so
      PRIVATE product repos DO inherit; only the source .github visibility matters. (This
      file-type could also inherit from an INTERNAL .github, but PUBLIC is chosen — see the
      Tier-2 escape-hatch note.) Docs-verified.

  - path: .github/CODEOWNERS
    tier: 2
    mechanism: copy
    source_of_truth: template/.github/CODEOWNERS.jinja
    applies_to: all
    required: true
    notes: >-
      FINAL DECISION: COPIED (not inherited) because GitHub does NOT auto-inherit CODEOWNERS
      from org/.github the way it does community-health files. Marker-block drift
      (baseline:start / baseline:end, using # comments valid in CODEOWNERS) with default
      `* {{ default_owner }}`; repo-specific path rules are appended OUTSIDE the block. The
      maintainers team must exist with WRITE access; keep code-owner-required review OFF
      while the repo is solo.

  - path: null
    tier: 2
    mechanism: inherit
    source_of_truth: Knowledgemonger-LLC/.github:.github/ISSUE_TEMPLATE/
    applies_to: all
    required: true
    notes: >-
      No action in target repo — issue templates inherited from Knowledgemonger-LLC/.github.
      DECISION (final): that repo is PUBLIC — REQUIRED here, since ISSUE_TEMPLATE and
      PULL_REQUEST_TEMPLATE inherit ONLY from a public .github (internal is insufficient).
      Inheritance keys on ACCOUNT OWNERSHIP (private repos DO inherit). ALL-OR-NOTHING: any
      local .github/ISSUE_TEMPLATE file makes the repo use NONE of the org defaults for that
      folder — the planned open-source repo will deliberately OVERRIDE with its own tailored
      templates. Docs-verified.

  - path: null
    tier: 2
    mechanism: inherit
    source_of_truth: Knowledgemonger-LLC/.github:.github/PULL_REQUEST_TEMPLATE.md
    applies_to: all
    required: true
    notes: >-
      No action in target repo — PR template inherited from Knowledgemonger-LLC/.github.
      DECISION (final): that repo is PUBLIC — REQUIRED, since PULL_REQUEST_TEMPLATE inherits
      ONLY from a public .github (internal insufficient). Inheritance keys on ACCOUNT OWNERSHIP
      (private repos DO inherit). Docs-verified.

  # ───────────────────────── Tier 3 — Agentic context files (copy) ─────────────────────────
  - path: AGENTS.md
    tier: 3
    mechanism: copy
    source_of_truth: template/AGENTS.md.jinja
    applies_to: all
    required: true
    notes: >-
      Canonical, cross-tool agent context. Marker-block sync: baseline content lives between
      <!-- baseline:start --> and <!-- baseline:end -->; repo-specific content is allowed
      outside the block and is preserved.

  - path: CLAUDE.md
    tier: 3
    mechanism: copy
    source_of_truth: template/CLAUDE.md.jinja
    applies_to: all
    required: true
    notes: >-
      Thin Claude-specific pointer to AGENTS.md. Marker-block sync
      (<!-- baseline:start --> / <!-- baseline:end -->).

  - path: .claude/settings.json
    tier: 3
    mechanism: copy
    source_of_truth: template/.claude/settings.json.jinja
    applies_to: all
    required: true
    notes: >-
      Permission model. JSON — NO markers. Managed-keys-subset rule: baseline keys
      (permissions.deny, defaultMode) must be present and equal; the repo may add extra
      allow/ask entries.

  - path: .claude/commands/
    tier: 3
    mechanism: copy
    source_of_truth: template/.claude/commands/
    applies_to: all
    required: false
    notes: >-
      Shared slash commands. Baseline commands are synced; repos may add local commands
      alongside them.

  # ──────────────── Tier 4 — Universal in KIND, specific in FORM (extend) ──────────────────
  - path: .github/workflows/ci.yml
    tier: 4
    mechanism: extend
    source_of_truth: Knowledgemonger-LLC/repo-baseline/.github/workflows/reusable-ci.yml@v1
    applies_to: all
    required: true
    notes: >-
      Thin caller that `uses:` this repo's reusable CI workflow (workflow_call). MUST pin to
      @v1 or a commit SHA, never @main. Logic lives in the reusable workflow hosted here.

  - path: .github/workflows/release.yml
    tier: 4
    mechanism: extend
    source_of_truth: Knowledgemonger-LLC/repo-baseline/.github/workflows/reusable-release.yml@v1
    applies_to: all
    required: false
    notes: >-
      Thin caller for the shared release/publish reusable workflow. Pin to @v1 or a SHA.

  - path: eslint.config.js
    tier: 4
    mechanism: extend
    source_of_truth: "pkg:eslint-config"
    applies_to: [javascript, typescript]
    required: false
    notes: >-
      Thin local config extending the published, independently-versioned shared package.
      Package lives in its own repo (NOT hosted here). npm SCOPE intentionally unset —
      pinned at first publish.

  - path: .prettierrc.json
    tier: 4
    mechanism: extend
    source_of_truth: "pkg:prettier-config"
    applies_to: [javascript, typescript]
    required: false
    notes: >-
      Thin pointer to the shared Prettier config package (external). npm SCOPE intentionally
      unset — pinned at first publish.

  - path: tsconfig.json
    tier: 4
    mechanism: extend
    source_of_truth: "pkg:tsconfig"
    applies_to: [typescript]
    required: false
    notes: >-
      Extends the shared tsconfig base (e.g. <scope>/tsconfig/base). External package. npm
      SCOPE intentionally unset — pinned at first publish.

  - path: renovate.json
    tier: 4
    mechanism: copy
    drift: managed-keys
    source_of_truth: template/renovate.json.jinja
    applies_to: all
    required: true
    notes: >-
      COPIED thin pointer. Marker-block-style drift, but JSON can't hold # markers, so it is
      enforced as managed-keys (like settings.json): MANAGED = `$schema` and `extends` must
      contain github>Knowledgemonger-LLC/renovate-config; repo-owned keys (packageRules,
      schedule, …) are FREE alongside it. Full-file would forbid legitimate per-repo Renovate
      customization. Rules themselves live in the external preset, NOT inlined here. DEFERRED
      EXTERNAL PREREQUISITE: Renovate errors on target repos until
      Knowledgemonger-LLC/renovate-config exists with a base preset — same "reference is right,
      target must be created" class as the v1 tag. Preferred over Dependabot.

  - path: .pre-commit-config.yaml
    tier: 4
    mechanism: copy
    drift: marker-block
    source_of_truth: template/.pre-commit-config.yaml.jinja
    applies_to: all
    required: false
    notes: >-
      COPIED with marker-block drift: the managed region (trailing-whitespace, end-of-file-fixer,
      check-yaml, check-json, detect-secrets) is synced; stack-specific hooks are appended
      OUTSIDE the region. Uses # comment markers (valid YAML).
