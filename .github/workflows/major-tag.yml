# Re-point the major tag (e.g. v1) at the latest matching vX.Y.Z release, so consumers who
# pin `...@v1` automatically track patch/minor fixes. Fires only on immutable 3-part tags;
# the force-moved major tag (v1) is NOT 3-part, so this never re-triggers itself.
name: major-tag

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Re-point major tag at this release
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"      # e.g. v1.2.3
          MAJOR="${TAG%%.*}"            # -> v1
          echo "Re-pointing ${MAJOR} -> ${TAG} (${GITHUB_SHA})"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "${MAJOR}" "${TAG}"
          git push -f origin "refs/tags/${MAJOR}"
