# Reusable CI workflow (Tier 4) — hosted here as the single source of truth.
# Target repos call it from a thin .github/workflows/ci.yml, pinned to @v1 (or a SHA).
# See examples/caller-ci.yml.
name: reusable-ci

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version."
        type: string
        default: "20"
      package-manager:
        description: "Package manager: pnpm | npm | yarn."
        type: string
        default: "pnpm"
      working-directory:
        description: "Directory to run in."
        type: string
        default: "."
      run-build:
        description: "Whether to run the build step."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}

      - name: Install (frozen lockfile)
        shell: bash
        run: |
          if [ "${{ inputs.package-manager }}" = "npm" ]; then
            npm ci
          else
            ${{ inputs.package-manager }} install --frozen-lockfile
          fi

      - name: Lint
        run: ${{ inputs.package-manager }} run lint

      - name: Test
        run: ${{ inputs.package-manager }} run test

      - name: Build
        if: inputs.run-build
        run: ${{ inputs.package-manager }} run build
